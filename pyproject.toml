[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myxguard"
version = "0.4.0"
description = "Prompt-injection scanner for AI agents. Rules use the standard library; an ONNX classifier is optional."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "XYMYX"}]
keywords = ["prompt-injection", "llm", "security", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0,<9"]
ml = ["onnxruntime>=1.17,<2", "tokenizers>=0.15,<0.23"]

[project.scripts]
myxguard = "myxguard.cli:main"

[tool.setuptools.packages.find]
include = ["myxguard*"]

[tool.setuptools.package-data]
myxguard = ["data/patterns/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
